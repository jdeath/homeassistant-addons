worker_processes 1;
pid /var/run/nginx.pid;
error_log /proc/1/fd/1 warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log   /proc/1/fd/1 combined;

    # Large image/model uploads and long-running generation jobs
    client_max_body_size 2048m;
    send_timeout 3600;

    # X-Ingress-Path (e.g. /api/hassio_ingress/<token>) when the request
    # comes through HA ingress; empty on direct access.
    map $http_x_ingress_path $ingress_path {
        default "";
        ~^(.+)$ $1;
    }

    # Gradio 6 embeds an ABSOLUTE "root" (scheme+host) in both the page's
    # window.gradio_config AND the /config JSON (the client re-fetches
    # /config and overwrites the page value). The client does
    # `new URL(root)` (throws on relative paths) and builds API URLs as
    # `${root}${api_prefix}/...`. File URLs (generated images) are built
    # from window.location.origin, which also lacks the ingress path.
    #
    # Under ingress, all of these URLs bypass HA. Three-layer fix:
    #
    # 1) sub_filter rewrites the absolute root in the page HTML and
    #    /config JSON to the full absolute ingress URL.
    #
    # 2) An injected script (via sub_filter on </head>) monkey-patches
    #    fetch, XHR, setAttribute, img.src, and uses a MutationObserver
    #    to rewrite any /gradio_api/ URL missing the ingress prefix.
    #    This catches file URLs, queue URLs, and any other request the
    #    Gradio client constructs. The script is a no-op on direct access
    #    ($ingress_path is empty).
    #
    # Direct access: the app computes root as http(s)://<host>:7860
    # (absolute, valid for new URL()); the sub_filter pattern only matches
    # the no-port host form, and the injected script exits immediately.
    sub_filter_once    off;
    sub_filter ',"root":"https://$http_host"' ',"root":"https://$http_host$ingress_path"';
    sub_filter ',"root":"http://$http_host"'  ',"root":"http://$http_host$ingress_path"';
    # Inject a script before </head> that rewrites any /gradio_api/ URL
    # missing the ingress prefix, covering: fetch (string + Request),
    # XMLHttpRequest, Element.setAttribute (src/href), HTMLImageElement.src,
    # and a MutationObserver for innerHTML-rendered images. Also rewrites
    # the "root" field in /config JSON responses. No-op on direct access.
    sub_filter '</head>' '<script>(function(){var p="$ingress_path";if(!p)return;function fxu(u){u=String(u);if(u.indexOf(p)>-1||u.indexOf("/gradio_api/")<0)return u;if(u[0]==="/")return p+u;try{var f=new URL(u);f.pathname=p+f.pathname;return f.toString()}catch(e){return u}}var o=fetch;fetch=function(a,b){var a2=a,cu="";if(typeof Request!=="undefined"&&a instanceof Request){cu=a.url;a2=new Request(fxu(cu),a)}else{cu=String(a);a2=fxu(cu)}return o(a2,b).then(function(r){if(cu.indexOf("/config")<0)return r;var c=r.clone();return c.json().then(function(j){if(!j||!j.root)return r;var v=new URL(j.root);v.pathname=p;j.root=v.toString();return new Response(JSON.stringify(j),{status:r.status,statusText:r.statusText,headers:r.headers})})})};var O=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){return O.call(this,m,fxu(String(u)))};var sa=Element.prototype.setAttribute;Element.prototype.setAttribute=function(n,v){if(n==="src"||n==="href")v=fxu(String(v));return sa.call(this,n,v)};var ds=HTMLImageElement.prototype;Object.defineProperty(ds,"src",{get:function(){return this.getAttribute("src")},set:function(v){this.setAttribute("src",fxu(String(v)))}});new MutationObserver(function(m){for(var i=0;i<m.length;i++)for(var n=0;n<m[i].addedNodes.length;n++){var e=m[i].addedNodes[n];if(e.nodeType!==1)continue;var imgs=e.querySelectorAll?e.querySelectorAll("img"):e.tagName==="IMG"?[e]:[];for(var j=0;j<imgs.length;j++){var s=imgs[j].getAttribute("src");if(s&&s.indexOf(p)<0&&s.indexOf("/gradio_api/")>-1)imgs[j].setAttribute("src",fxu(s))}}}).observe(document.documentElement,{childList:true,subtree:true})})();</script></head>';

    server {
        listen %%port%%;

        # Gradio's queue SSE/websocket (under /gradio_api/queue/...)
        location /gradio_api/queue/ {
            proxy_pass         http://127.0.0.1:7860;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $http_host;
            proxy_read_timeout 3600;
            # NO X-Forwarded-Proto: keeps Gradio's computed "root" relative.
        }

        location / {
            proxy_pass         http://127.0.0.1:7860;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            # NO X-Forwarded-Proto: with it, Gradio builds root as
            # http://host (absolute, bypasses ingress, and http under an
            # https origin = mixed content). Without it, root is relative.
        }
    }
}
