name: "SillyTavern"
version: "1.18.0"
upstream: "1.18.0"
slug: sillytavern
description: >-
  A locally installed user interface that allows you to interact with text generation LLMs, image generation engines, and TTS voice models.
arch:
  - amd64
  - aarch64
url: "https://github.com/jdeath/homeassistant-addons"
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Web Interface"
map:
  - type: addon_config
    read_only: false
    path: /home/node/app/config
environment:
  TINI_SUBREAPER: "true"
  SILLYTAVERN_VERSION: "latest"
  PUBLIC_PORT: "8000"
  SILLYTAVERN_DATAROOT: "/home/node/app/config/data"
image: ghcr.io/sillytavern/sillytavern
boot: auto
startup: services
webui: "[PROTO:ssl]://[HOST]:[PORT:8000]"
panel_admin: false
ingress: false
ingress_port: 8000
